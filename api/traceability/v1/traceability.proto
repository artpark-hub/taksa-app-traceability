syntax = "proto3";

package api.traceability.v1;

import "google/api/annotations.proto";

option go_package = "traceability/api/traceability/v1;v1";

service Traceability {
    // 1. Enterprise Management
    rpc CreateEnterprise (CreateEnterpriseRequest) returns (CreateEnterpriseReply) {
        option (google.api.http) = { post: "/api/v1/traceability/enterprises", body: "*" };
    }
    rpc ListEnterprises (ListEnterprisesRequest) returns (ListEnterprisesReply) {
        option (google.api.http) = { get: "/api/v1/traceability/enterprises" };
    }
    rpc UpdateEnterprise (UpdateEnterpriseRequest) returns (UpdateEnterpriseReply) {
        option (google.api.http) = { patch: "/api/v1/traceability/enterprises/{id}", body: "*" };
    }
    rpc DeleteEnterprise (DeleteEnterpriseRequest) returns (DeleteEnterpriseReply) {
        option (google.api.http) = { delete: "/api/v1/traceability/enterprises/{id}" };
    }

    // 2. Site Management
    rpc CreateSite (CreateSiteRequest) returns (CreateSiteReply) {
        option (google.api.http) = { post: "/api/v1/traceability/sites", body: "*" };
    }
    rpc ListSites (ListSitesRequest) returns (ListSitesReply) {
        option (google.api.http) = { get: "/api/v1/traceability/sites" };
    }
    rpc UpdateSite (UpdateSiteRequest) returns (UpdateSiteReply) {
        option (google.api.http) = { patch: "/api/v1/traceability/sites/{id}", body: "*" };
    }
    rpc DeleteSite (DeleteSiteRequest) returns (DeleteSiteReply) {
        option (google.api.http) = { delete: "/api/v1/traceability/sites/{id}" };
    }

    // 3. Area Management
    rpc CreateArea (CreateAreaRequest) returns (CreateAreaReply) {
        option (google.api.http) = { post: "/api/v1/traceability/areas", body: "*" };
    }
    rpc ListAreas (ListAreasRequest) returns (ListAreasReply) {
        option (google.api.http) = { get: "/api/v1/traceability/areas" };
    }
    rpc UpdateArea (UpdateAreaRequest) returns (UpdateAreaReply) {
        option (google.api.http) = { patch: "/api/v1/traceability/areas/{id}", body: "*" };
    }
    rpc DeleteArea (DeleteAreaRequest) returns (DeleteAreaReply) {
        option (google.api.http) = { delete: "/api/v1/traceability/areas/{id}" };
    }

    // 4. Production Line Management
    rpc CreateLine (CreateLineRequest) returns (CreateLineReply) {
        option (google.api.http) = { post: "/api/v1/traceability/lines", body: "*" };
    }
    rpc ListLines (ListLinesRequest) returns (ListLinesReply) {
        option (google.api.http) = { get: "/api/v1/traceability/lines" };
    }
    rpc UpdateLine (UpdateLineRequest) returns (UpdateLineReply) {
        option (google.api.http) = { patch: "/api/v1/traceability/lines/{id}", body: "*" };
    }
    rpc DeleteLine (DeleteLineRequest) returns (DeleteLineReply) {
        option (google.api.http) = { delete: "/api/v1/traceability/lines/{id}" };
    }

    // 5. Production Unit Management
    rpc CreateProductionUnit (CreateProductionUnitRequest) returns (CreateProductionUnitReply) {
        option (google.api.http) = { post: "/api/v1/traceability/production-units", body: "*" };
    }
    rpc ListProductionUnits (ListProductionUnitsRequest) returns (ListProductionUnitsReply) {
        option (google.api.http) = { get: "/api/v1/traceability/production-units" };
    }
    rpc UpdateProductionUnit (UpdateProductionUnitRequest) returns (UpdateProductionUnitReply) {
        option (google.api.http) = { patch: "/api/v1/traceability/production-units/{id}", body: "*" };
    }
    rpc DeleteProductionUnit (DeleteProductionUnitRequest) returns (DeleteProductionUnitReply) {
        option (google.api.http) = { delete: "/api/v1/traceability/production-units/{id}" };
    }

    // 6. Equipment Class Management
    rpc CreateEquipmentClass (CreateEquipmentClassRequest) returns (CreateEquipmentClassReply) {
        option (google.api.http) = { post: "/api/v1/traceability/equipment-classes", body: "*" };
    }
    rpc ListEquipmentClasses (ListEquipmentClassesRequest) returns (ListEquipmentClassesReply) {
        option (google.api.http) = { get: "/api/v1/traceability/equipment-classes" };
    }
    rpc UpdateEquipmentClass (UpdateEquipmentClassRequest) returns (UpdateEquipmentClassReply) {
        option (google.api.http) = { patch: "/api/v1/traceability/equipment-classes/{id}", body: "*" };
    }
    rpc DeleteEquipmentClass (DeleteEquipmentClassRequest) returns (DeleteEquipmentClassReply) {
        option (google.api.http) = { delete: "/api/v1/traceability/equipment-classes/{id}" };
    }

    // 7. Equipment Master Management
    rpc RegisterEquipment (RegisterEquipmentRequest) returns (RegisterEquipmentReply) {
        option (google.api.http) = { post: "/api/v1/traceability/equipment", body: "*" };
    }
    rpc ListEquipment (ListEquipmentRequest) returns (ListEquipmentReply) {
        option (google.api.http) = { get: "/api/v1/traceability/equipment" };
    }
    rpc UpdateEquipment (UpdateEquipmentRequest) returns (UpdateEquipmentReply) {
        option (google.api.http) = { patch: "/api/v1/traceability/equipment/{id}", body: "*" };
    }
    rpc DeleteEquipment (DeleteEquipmentRequest) returns (DeleteEquipmentReply) {
        option (google.api.http) = { delete: "/api/v1/traceability/equipment/{id}" };
    }

    // 8. Equipment Capability Management
    rpc AddCapability (AddCapabilityRequest) returns (AddCapabilityReply) {
        option (google.api.http) = { post: "/api/v1/traceability/equipment/{equipment_id}/capabilities", body: "*" };
    }
    rpc ListCapabilities (ListCapabilitiesRequest) returns (ListCapabilitiesReply) {
        option (google.api.http) = { get: "/api/v1/traceability/equipment/{equipment_id}/capabilities" };
    }
    rpc UpdateCapability (UpdateCapabilityRequest) returns (UpdateCapabilityReply) {
        option (google.api.http) = { patch: "/api/v1/traceability/equipment/{equipment_id}/capabilities/{id}", body: "*" };
    }
    rpc DeleteCapability (DeleteCapabilityRequest) returns (DeleteCapabilityReply) {
        option (google.api.http) = { delete: "/api/v1/traceability/equipment/{equipment_id}/capabilities/{id}" };
    }

    // 9. Equipment Property Management
    rpc SetProperty (SetPropertyRequest) returns (SetPropertyReply) {
        option (google.api.http) = { post: "/api/v1/traceability/equipment/{equipment_id}/properties", body: "*" };
    }
    rpc ListProperties (ListPropertiesRequest) returns (ListPropertiesReply) {
        option (google.api.http) = { get: "/api/v1/traceability/equipment/{equipment_id}/properties" };
    }
    rpc UpdateProperty (UpdatePropertyRequest) returns (UpdatePropertyReply) {
        option (google.api.http) = { patch: "/api/v1/traceability/equipment/{equipment_id}/properties/{id}", body: "*" };
    }
    rpc DeleteProperty (DeletePropertyRequest) returns (DeletePropertyReply) {
        option (google.api.http) = { delete: "/api/v1/traceability/equipment/{equipment_id}/properties/{id}" };
    }

    // 10. Traceability Logs
    rpc LogEvent (LogEventRequest) returns (LogEventReply) {
        option (google.api.http) = { post: "/api/v1/traceability/logs", body: "*" };
    }
    rpc ListLogs (ListLogsRequest) returns (ListLogsReply) {
        option (google.api.http) = { get: "/api/v1/traceability/logs" };
    }

    // 11. Material Definition Management
    rpc CreateMaterialDefinition (CreateMaterialDefinitionRequest) returns (CreateMaterialDefinitionReply) {
        option (google.api.http) = { post: "/api/v1/traceability/material-definitions", body: "*" };
    }
    rpc ListMaterialDefinitions (ListMaterialDefinitionsRequest) returns (ListMaterialDefinitionsReply) {
        option (google.api.http) = { get: "/api/v1/traceability/material-definitions" };
    }

    // 12. Material Lot Management
    rpc CreateMaterialLot (CreateMaterialLotRequest) returns (CreateMaterialLotReply) {
        option (google.api.http) = { post: "/api/v1/traceability/lots", body: "*" };
    }
    rpc GetMaterialLot (GetMaterialLotRequest) returns (GetMaterialLotReply) {
        option (google.api.http) = { get: "/api/v1/traceability/lots/{lot_id}" };
    }
    rpc ListMaterialLots (ListMaterialLotsRequest) returns (ListMaterialLotsReply) {
        option (google.api.http) = { get: "/api/v1/traceability/lots" };
    }
    rpc UpdateMaterialLotStatus (UpdateMaterialLotStatusRequest) returns (UpdateMaterialLotStatusReply) {
        option (google.api.http) = { patch: "/api/v1/traceability/lots/{lot_id}/status", body: "*" };
    }

    // 13. Operator Management
    rpc CreateOperator (CreateOperatorRequest) returns (CreateOperatorReply) {
        option (google.api.http) = { post: "/api/v1/traceability/operators", body: "*" };
    }
    rpc ListOperators (ListOperatorsRequest) returns (ListOperatorsReply) {
        option (google.api.http) = { get: "/api/v1/traceability/operators" };
    }
    rpc UpdateOperator (UpdateOperatorRequest) returns (UpdateOperatorReply) {
        option (google.api.http) = { patch: "/api/v1/traceability/operators/{operator_id}", body: "*" };
    }

    // 14. Work Order Management
    rpc CreateWorkOrder (CreateWorkOrderRequest) returns (CreateWorkOrderReply) {
        option (google.api.http) = { post: "/api/v1/traceability/work-orders", body: "*" };
    }
    rpc GetWorkOrder (GetWorkOrderRequest) returns (GetWorkOrderReply) {
        option (google.api.http) = { get: "/api/v1/traceability/work-orders/{work_order_id}" };
    }
    rpc ListWorkOrders (ListWorkOrdersRequest) returns (ListWorkOrdersReply) {
        option (google.api.http) = { get: "/api/v1/traceability/work-orders" };
    }
    rpc UpdateWorkOrderStatus (UpdateWorkOrderStatusRequest) returns (UpdateWorkOrderStatusReply) {
        option (google.api.http) = { patch: "/api/v1/traceability/work-orders/{work_order_id}/status", body: "*" };
    }

    // 15. Lot Genealogy Registration
    rpc RegisterGenealogyLink (RegisterGenealogyLinkRequest) returns (RegisterGenealogyLinkReply) {
        option (google.api.http) = { post: "/api/v1/traceability/genealogy", body: "*" };
    }

    // 16. Traceability Queries
    rpc TraceBackward (TraceRequest) returns (TraceReply) {
        option (google.api.http) = { get: "/api/v1/traceability/trace/backward/{lot_id}" };
    }
    rpc TraceForward (TraceRequest) returns (TraceReply) {
        option (google.api.http) = { get: "/api/v1/traceability/trace/forward/{lot_id}" };
    }
    rpc TraceFullGenealogy (TraceRequest) returns (GenealogyTreeReply) {
        option (google.api.http) = { get: "/api/v1/traceability/trace/full/{lot_id}" };
    }
    rpc GetEquipmentProcessHistory (TraceRequest) returns (EquipmentProcessHistoryReply) {
        option (google.api.http) = { get: "/api/v1/traceability/trace/equipment-history/{lot_id}" };
    }

    // 17. Historical Analytics
    rpc GetMachinePerformance (MachinePerformanceRequest) returns (MachinePerformanceReply) {
        option (google.api.http) = { get: "/api/v1/traceability/analytics/machine-performance" };
    }
    rpc CompareMachinePerformance (MachineComparisonRequest) returns (MachineComparisonReply) {
        option (google.api.http) = { post: "/api/v1/traceability/analytics/machine-comparison", body: "*" };
    }
    rpc GetProductionTrends (ProductionTrendsRequest) returns (ProductionTrendsReply) {
        option (google.api.http) = { get: "/api/v1/traceability/analytics/production-trends" };
    }
    rpc GetDashboardSummary (DashboardSummaryRequest) returns (DashboardSummaryReply) {
        option (google.api.http) = { get: "/api/v1/traceability/analytics/dashboard" };
    }
}

// ---------------- Messages ----------------

// 1. Enterprise
message CreateEnterpriseRequest {
    string name = 1;
    string description = 2;
}

message CreateEnterpriseReply {
    int32 id = 1;
}

message ListEnterprisesRequest {
}

message ListEnterprisesReply {
    repeated Enterprise enterprises = 1;
}

message Enterprise {
    int32 id = 1;
    string name = 2;
    string description = 3;
}

message UpdateEnterpriseRequest {
    int32 id = 1;
    string name = 2;
    string description = 3;
}

message UpdateEnterpriseReply {
    bool success = 1;
}

message DeleteEnterpriseRequest {
    int32 id = 1;
}

message DeleteEnterpriseReply {
    bool success = 1;
}

// 2. Site
message CreateSiteRequest {
    int32 enterprise_id = 1;
    string name = 2;
    string location = 3;
    string description = 4;
}

message CreateSiteReply {
    int32 id = 1;
}

message ListSitesRequest {
    int32 enterprise_id = 1;
}

message ListSitesReply {
    repeated Site sites = 1;
}

message Site {
    int32 id = 1;
    string name = 2;
    string location = 3;
    string description = 4;
}

message UpdateSiteRequest {
    int32 id = 1;
    string location = 2;
}

message UpdateSiteReply {
    bool success = 1;
}

message DeleteSiteRequest {
    int32 id = 1;
}

message DeleteSiteReply {
    bool success = 1;
}

// 3. Area
message CreateAreaRequest {
    int32 site_id = 1;
    string name = 2;
    string description = 3;
}

message CreateAreaReply {
    int32 id = 1;
}

message ListAreasRequest {
    int32 site_id = 1;
}

message ListAreasReply {
    repeated Area areas = 1;
}

message Area {
    int32 id = 1;
    string name = 2;
    string description = 3;
}

message UpdateAreaRequest {
    int32 id = 1;
    string name = 2;
    string description = 3; 
}

message UpdateAreaReply {
    bool success = 1;
}

message DeleteAreaRequest {
    int32 id = 1;
}

message DeleteAreaReply {
    bool success = 1;
}

// 4. Production Line
message CreateLineRequest {
    int32 area_id = 1;
    string name = 2;
    string description = 3;
}

message CreateLineReply {
    int32 id = 1;
}

message ListLinesRequest {
    int32 area_id = 1;
}

message ListLinesReply {
    repeated Line lines = 1;
}

message Line {
    int32 id = 1;
    string name = 2;
    string description = 3;
}

message UpdateLineRequest {
    int32 id = 1;
    string name = 2;
    string description = 3;
}

message UpdateLineReply {
    bool success = 1;
}

message DeleteLineRequest {
    int32 id = 1;
}

message DeleteLineReply {
    bool success = 1;
}

// 5. Production Unit
message CreateProductionUnitRequest {
    int32 production_line_id = 1;
    string name = 2;
    string description = 3;
}

message CreateProductionUnitReply {
    int32 id = 1;
}

message ListProductionUnitsRequest {
    int32 line_id = 1;
}

message ListProductionUnitsReply {
    repeated ProductionUnit units = 1;
}

message ProductionUnit {
    int32 id = 1;
    string name = 2;
    string description = 3;
}

message UpdateProductionUnitRequest {
    int32 id = 1;
    string name = 2;
    string description = 3;
}

message UpdateProductionUnitReply {
    bool success = 1;
}

message DeleteProductionUnitRequest {
    int32 id = 1;
}

message DeleteProductionUnitReply {
    bool success = 1;
}

// 6. Equipment Class
message CreateEquipmentClassRequest {
    string class_name = 1;
    string version = 2;
    string description = 3;
}

message CreateEquipmentClassReply {
    int32 id = 1;
}

message ListEquipmentClassesRequest {
}

message ListEquipmentClassesReply {
    repeated EquipmentClass classes = 1;
}

message EquipmentClass {
    int32 id = 1;
    string class_name = 2;
    string version = 3;
    string description = 4;
}

message UpdateEquipmentClassRequest {
    int32 id = 1;
    string version = 2;
    string description = 3;
}

message UpdateEquipmentClassReply {
    bool success = 1;
}

message DeleteEquipmentClassRequest {
    int32 id = 1;
}

message DeleteEquipmentClassReply {
    bool success = 1;
}

// 7. Equipment Master
message RegisterEquipmentRequest {
    string id = 1;
    string physical_asset_id = 2;
    int32 production_unit_id = 3;
    int32 equipment_class_id = 4;
    string operational_status = 5;
    string parent_equipment_id = 6;
}

message RegisterEquipmentReply {
    string id = 1;
}

message ListEquipmentRequest {
    int32 line_id = 1;
    string parent_equipment_id = 2;
}

message ListEquipmentReply {
    repeated Equipment equipment = 1;
}
message Equipment {
    string id = 1;
    string physical_asset_id = 2;
    int32 production_unit_id = 3;
    int32 equipment_class_id = 4;
    string operational_status = 5;
    string parent_equipment_id = 6;
}

message UpdateEquipmentRequest {
    string id = 1;
    string operational_status = 2;
    int32 production_unit_id = 3;
}

message UpdateEquipmentReply {
    bool success = 1;
}

message DeleteEquipmentRequest {
    string id = 1;
}

message DeleteEquipmentReply {
    bool success = 1;
}

// 8. Capabilities
message AddCapabilityRequest {
    string equipment_id = 1;
    string capability_name = 2;
    string value = 3;
    string uom = 4;
    string description = 5;
}

message AddCapabilityReply {
    int32 id = 1;
}

message ListCapabilitiesRequest {
    string equipment_id = 1;
}

message ListCapabilitiesReply {
    repeated Capability capabilities = 1;
}

message Capability {
    int32 id = 1;
    string name = 2;
    string value = 3;
    string uom = 4;
    string description = 5;
}

message UpdateCapabilityRequest {
    string equipment_id = 1;
    int32 id = 2;
    string value = 3;
}

message UpdateCapabilityReply {
    bool success = 1;
}

message DeleteCapabilityRequest {
    string equipment_id = 1;
    int32 id = 2;
}

message DeleteCapabilityReply {
    bool success = 1;
}

// 9. Properties
message SetPropertyRequest {
    string equipment_id = 1;
    string property_name = 2;
    string current_value = 3;
}

message SetPropertyReply {
    int32 id = 1;
}

message ListPropertiesRequest {
    string equipment_id = 1;
}

message ListPropertiesReply {
    repeated Property properties = 1;
}

message Property {
    int32 id = 1;
    string name = 2;
    string value = 3;
}

message UpdatePropertyRequest {
    string equipment_id = 1;
    int32 id = 2;
    string current_value = 3;
}

message UpdatePropertyReply {
    bool success = 1;
}

message DeletePropertyRequest {
    string equipment_id = 1;
    int32 id = 2;
}

message DeletePropertyReply {
    bool success = 1;
}

// 10. Traceability Logs
message LogEventRequest {
    string equipment_id = 1;
    string event_type = 2;
    string work_order_id = 3;
    string material_lot_id = 4;
    string operator_id = 5;
}

message LogEventReply {
    int32 id = 1;
}

message ListLogsRequest {
    string work_order_id = 1;
}

message ListLogsReply {
    repeated LogEntry logs = 1;
}

message LogEntry {
    string equipment_id = 1;
    string event_type = 2;
    string event_time = 3;
    string operator_id = 4;
}


// 11. Material Definition Messages
message CreateMaterialDefinitionRequest {
    string name = 1;                
    string material_type = 2;       
    string unit_of_measure = 3;     
    string description = 4;
}

message CreateMaterialDefinitionReply {
    int32 id = 1;
}

message ListMaterialDefinitionsRequest {
    string material_type = 1;       
}

message ListMaterialDefinitionsReply {
    repeated MaterialDefinition definitions = 1;
}

message MaterialDefinition {
    int32 id = 1;
    string name = 2;
    string material_type = 3;
    string unit_of_measure = 4;
    string description = 5;
}

// 12. Material Lot Messages
message CreateMaterialLotRequest {
    string lot_id = 1;                  
    int32 material_definition_id = 2;
    double quantity = 3;
    string unit_of_measure = 4;
}

message CreateMaterialLotReply {
    string lot_id = 1;
}

message GetMaterialLotRequest {
    string lot_id = 1;
}

message GetMaterialLotReply {
    string lot_id = 1;
    string status = 2;
    double quantity = 3;
    string unit_of_measure = 4;
    string created_at = 5;
    string updated_at = 6;
    int32 material_definition_id = 7;
    string material_name = 8;
    string material_type = 9;
    string material_description = 10;
}

message ListMaterialLotsRequest {
    string status = 1;              
    string material_type = 2;       
}

message ListMaterialLotsReply {
    repeated MaterialLotSummary lots = 1;
}

message MaterialLotSummary {
    string lot_id = 1;
    string status = 2;
    double quantity = 3;
    string unit_of_measure = 4;
    string created_at = 5;
    string material_name = 6;
    string material_type = 7;
}

message UpdateMaterialLotStatusRequest {
    string lot_id = 1;
    string status = 2;             
}

message UpdateMaterialLotStatusReply {
    bool success = 1;
}


// 13. Operator Messages
message CreateOperatorRequest {
    string operator_id = 1;         
    string name = 2;
    string role = 3;
    string shift = 4;               
}

message CreateOperatorReply {
    string operator_id = 1;
}

message ListOperatorsRequest {
    string shift = 1;               
    string status = 2;              
}

message ListOperatorsReply {
    repeated Operator operators = 1;
}

message Operator {
    string operator_id = 1;
    string name = 2;
    string role = 3;
    string shift = 4;
    string status = 5;
}

message UpdateOperatorRequest {
    string operator_id = 1;
    string role = 2;
    string shift = 3;
    string status = 4;
}

message UpdateOperatorReply {
    bool success = 1;
}

// 14. Work Order Messages
message CreateWorkOrderRequest {
    string work_order_id = 1;       
    string description = 2;
    string equipment_id = 3;
    string operator_id = 4;
    string output_lot_id = 5;
    double planned_quantity = 6;
    string unit_of_measure = 7;
    string planned_start = 8;       
    string planned_end = 9;
}

message CreateWorkOrderReply {
    string work_order_id = 1;
}

message GetWorkOrderRequest {
    string work_order_id = 1;
}

message GetWorkOrderReply {
    string work_order_id = 1;
    string description = 2;
    string status = 3;
    double planned_quantity = 4;
    double actual_quantity = 5;
    string unit_of_measure = 6;
    string planned_start = 7;
    string planned_end = 8;
    string actual_start = 9;
    string actual_end = 10;
    string output_lot_id = 11;
    // Equipment info
    string equipment_id = 12;
    string equipment_class_name = 13;
    // Operator info
    string operator_id = 14;
    string operator_name = 15;
    string operator_shift = 16;
    // Input lots consumed by this work order
    repeated WorkOrderInputLot input_lots = 17;
}

message WorkOrderInputLot {
    string lot_id = 1;
    string material_name = 2;
    string material_type = 3;
    double quantity_consumed = 4;
    string unit_of_measure = 5;
}

message ListWorkOrdersRequest {
    string status = 1;              
    string equipment_id = 2;        
}

message ListWorkOrdersReply {
    repeated WorkOrderSummary work_orders = 1;
}

message WorkOrderSummary {
    string work_order_id = 1;
    string description = 2;
    string status = 3;
    string equipment_id = 4;
    string operator_id = 5;
    string output_lot_id = 6;
    string actual_start = 7;
    string actual_end = 8;
}

message UpdateWorkOrderStatusRequest {
    string work_order_id = 1;
    string status = 2;              
    double actual_quantity = 3;     
    string actual_start = 4;        
    string actual_end = 5;         
}

message UpdateWorkOrderStatusReply {
    bool success = 1;
}

// 15. Lot Genealogy Messages

message RegisterGenealogyLinkRequest {
    string parent_lot_id = 1;       
    string child_lot_id = 2;        
    string work_order_id = 3;
    string equipment_id = 4;
    double quantity_consumed = 5;
    double quantity_produced = 6;
}

message RegisterGenealogyLinkReply {
    int32 id = 1;
}

// 16. Traceability Query Messages (THE CORE)

// Shared request for all trace queries — just needs a lot_id
message TraceRequest {
    string lot_id = 1;
}

// --- Backward & Forward Trace Response ---
message TraceReply {
    string queried_lot_id = 1;
    string trace_direction = 2;        
    repeated TraceNode nodes = 3;
}


message TraceNode {
    int32 depth = 1;
    string lot_id = 2;
    string related_lot_id = 3;         
    string material_name = 4;
    string material_type = 5;
    string lot_status = 6;
    double quantity = 7;
    string unit_of_measure = 8;
    double quantity_used = 9;           
    string work_order_id = 10;
    string equipment_id = 11;
    string equipment_class_name = 12;
    string operator_id = 13;
    string operator_name = 14;
    string event_time = 15;
}

// --- Full Genealogy Tree Response ---

message GenealogyTreeReply {
    string center_lot_id = 1;
    repeated GenealogyNode nodes = 2;
    repeated GenealogyEdge edges = 3;
}

message GenealogyNode {
    string lot_id = 1;
    string material_name = 2;
    string material_type = 3;
    string status = 4;
    double quantity = 5;
    string unit_of_measure = 6;
}

message GenealogyEdge {
    string source_lot_id = 1;           
    string target_lot_id = 2;           
    string work_order_id = 3;
    string equipment_id = 4;
    double quantity_consumed = 5;
    double quantity_produced = 6;
    string event_time = 7;
}

// --- Equipment Process History Response ---
message EquipmentProcessHistoryReply {
    string lot_id = 1;
    repeated EquipmentParameterSummary parameters = 2;
    repeated TelemetryReading readings = 3;
}

// Aggregated summary per parameter
message EquipmentParameterSummary {
    string equipment_id = 1;
    string equipment_class_name = 2;
    string parameter_name = 3;
    string unit_of_measure = 4;
    double min_value = 5;
    double max_value = 6;
    double avg_value = 7;
    int32 reading_count = 8;
    string process_start = 9;
    string process_end = 10;
}

// Individual telemetry data point
message TelemetryReading {
    string equipment_id = 1;
    string parameter_name = 2;
    double value = 3;
    string unit_of_measure = 4;
    string recorded_at = 5;
}

// 17. Historical Analytics Messages 

// --- Machine Performance ---
message MachinePerformanceRequest {
    string equipment_id = 1;
    string from_time = 2;           
    string to_time = 3;             
}

message MachinePerformanceReply {
    string equipment_id = 1;
    string equipment_class_name = 2;
    string operational_status = 3;
    string from_time = 4;
    string to_time = 5;
    int32  total_work_orders = 6;
    double total_units_produced = 7;
    double avg_cycle_time_hours = 8;
    double total_active_hours = 9;
    double utilization_pct = 10;    // (active_hours / window_hours) * 100
    repeated MachineEventSummary event_summary = 11;
}

message MachineEventSummary {
    string event_type = 1;
    int32  count = 2;
}

// --- Machine Comparison ---
message MachineComparisonRequest {
    repeated string equipment_ids = 1;
    string from_time = 2;
    string to_time = 3;
}

message MachineComparisonReply {
    string from_time = 1;
    string to_time = 2;
    repeated MachineMetrics machines = 3;
}

message MachineMetrics {
    string equipment_id = 1;
    string equipment_class_name = 2;
    string operational_status = 3;
    int32  total_work_orders = 4;
    double total_units_produced = 5;
    double avg_cycle_time_hours = 6;
    double utilization_pct = 7;
    int32  error_count = 8;
}

// --- Production Trends ---
message ProductionTrendsRequest {
    string from_time = 1;
    string to_time = 2;
    string granularity = 3;         
    string equipment_id = 4;        
}

message ProductionTrendsReply {
    string from_time = 1;
    string to_time = 2;
    string granularity = 3;
    repeated ProductionTrendPoint data_points = 4;
}

message ProductionTrendPoint {
    string period = 1;             
    string equipment_id = 2;
    double units_produced = 3;
    int32  work_orders_completed = 4;
    double avg_cycle_time_hours = 5;
}

// --- Dashboard Summary ---
message DashboardSummaryRequest {
    string from_time = 1;
    string to_time = 2;
}

message DashboardSummaryReply {
    string from_time = 1;
    string to_time = 2;
    // Production KPIs
    double total_units_produced = 3;
    int32  total_work_orders_completed = 4;
    int32  active_equipment_count = 5;
    // Quality KPIs
    int32  lots_released = 6;
    int32  lots_quarantined = 7;
    double quality_rate_pct = 8;    // released / (released + quarantined) * 100
    // Total event anomalies
    int32  total_error_events = 9;
    // Top performing machines
    repeated MachineMetrics top_performers = 10;
}

